# Public M1-M4 source registry. Values are descriptive only; builders own the
# column-level mappings. Unknown releases are stated as not_recorded rather
# than inferred. Quarantine and superseded inputs are intentionally absent.
sources:
  thermompnn_stability:
    display_name: "ThermoMPNN predicted stability change (ΔΔG)"
    layer: "variant_stability"
    source_release: "local_2026-08-21"
    record_grain: "canonical protein single-amino-acid substitution prediction"
    model_name: "ThermoMPNN"
    structure_input: "AlphaFold DB v6"
    unit: "kcal/mol"
    sign_convention: "negative predicted stabilizing; positive predicted destabilizing"
    caveat: "A model-predicted thermodynamic stability change; not fitness, function, pathogenicity, experimental measurement, or clinical evidence."
  uniprot_basic:
    display_name: "UniProt basic information and canonical sequence"
    layer: "protein"
    source_release: "2026_02"
    record_grain: "reviewed human protein entry, sequence, identifier, or isoform relation"
    caveat: "Canonical UniProt accession is the protein-page identity; aliases and stable IDs may map to multiple entries."
  goa_annotation:
    display_name: "Gene Ontology Annotation and local GO term dictionary"
    layer: "annotation"
    source_release: "GOA ontology 2026-07-26; local GO OBO 2026-06-15"
    record_grain: "UniProt-GO annotation evidence"
    caveat: "GOA and the local go-basic.obo snapshot dates differ; NOT annotations remain explicit and do not enter positive summaries."
  reactome:
    display_name: "Reactome pathway membership"
    layer: "annotation"
    source_release: "not_recorded"
    record_grain: "protein-pathway membership"
    caveat: "Membership records retain their native pathway granularity; parent and child pathways are not one fact."
  uniprot_features:
    display_name: "UniProt canonical sequence features"
    layer: "sequence_site"
    source_release: "2026_02"
    record_grain: "canonical point or closed-interval feature"
    caveat: "Only parseable in-range canonical coordinates are drawn; uncertain boundary modifiers remain explicit."
  uniprot_covalent_structure:
    display_name: "UniProt covalent structure features"
    layer: "sequence_site"
    source_release: "2026_02"
    record_grain: "covalently linked endpoint pair"
    caveat: "Disulfides and other covalent pairs are linked endpoints, not filled sequence intervals."
  dbptm:
    display_name: "dbPTM canonical site evidence"
    layer: "sequence_site"
    source_release: "not_recorded"
    record_grain: "canonical site, PTM type, and PMID display evidence"
    caveat: "Site evidence, unique site-type, and unique site counts are different denominators."
  pfam:
    display_name: "Pfam domain matches"
    layer: "sequence_site"
    source_release: "per_record"
    record_grain: "canonical protein-Pfam domain match"
    caveat: "Displayed boundaries use the source envelope coordinates and retain per-record Pfam release."
  consurf:
    display_name: "ConSurf conservation"
    layer: "sequence_site"
    source_release: "not_recorded"
    record_grain: "canonical residue conservation record"
    caveat: "The upstream UniRef release is unresolved_from_fasta_header; confidence, occupancy, and alignment context remain necessary for interpretation."
  clinvar_variant:
    display_name: "ClinVar variant evidence"
    layer: "variant"
    source_release: "not_recorded"
    record_grain: "variant-phenotype source record"
    caveat: "Multiple RCV or phenotype records remain separate and are not collapsed into a cross-source pathogenicity score."
  cosmic_variant:
    display_name: "COSMIC variant evidence"
    layer: "variant"
    source_release: "not_recorded"
    record_grain: "variant COSMIC source record"
    caveat: "Sample count is not interpreted as cancer-specific frequency or ClinVar-like pathogenicity."
  gnomad_variant:
    display_name: "gnomAD population frequency"
    layer: "variant"
    source_release: "not_recorded"
    record_grain: "genomic variant frequency measurement"
    caveat: "Joint, exome, and genome allele frequencies retain their original denominators and missing states."
  dbsnp_variant:
    display_name: "dbSNP identifiers"
    layer: "variant"
    source_release: "not_recorded"
    record_grain: "stable identifier attached to a genomic variant"
    caveat: "Identifiers provide navigation and do not supply a clinical classification."
  alphamissense:
    display_name: "AlphaMissense predictions"
    layer: "variant"
    source_release: "not_recorded"
    record_grain: "missense variant prediction"
    caveat: "Predictions are displayed as source values and are not combined into a clinical or variant-priority score."
  alphagenome:
    display_name: "AlphaGenome predicted regulatory landscape"
    layer: "regulatory_prediction"
    source_release: "local run 2026-08-15; checkpoint a8f293a76ee73d5b57f3bf2ae146510589fcf187"
    record_grain: "reference-sequence prediction track within a gene-centered GRCh38 1 Mb model window"
    caveat: "This local selected-output archive is a model prediction, not an experimental measurement or REF/ALT variant-effect score; it omits DNase and transcription-factor ChIP outputs."
  hpa_rna_expression:
    display_name: "Human Protein Atlas RNA expression"
    layer: "expression"
    source_release: "not_recorded"
    record_grain: "source tissue RNA expression measurement"
    caveat: "Values are raw nTPM and are not quantitatively merged with MS, IHC, or PaxDB."
  hpa_ms_expression:
    display_name: "Human Protein Atlas mass-spectrometry expression"
    layer: "expression"
    source_release: "not_recorded"
    record_grain: "source tissue protein-intensity measurement"
    caveat: "Source intensity has its own scale; NULL means missing and is never converted to zero."
  hpa_ihc_expression:
    display_name: "Human Protein Atlas immunohistochemistry"
    layer: "expression"
    source_release: "not_recorded"
    record_grain: "source tissue and cell-type categorical staining record"
    caveat: "Staining level is categorical and reliability remains attached to each record."
  paxdb_expression:
    display_name: "PaxDB protein abundance"
    layer: "expression"
    source_release: "v6.1"
    record_grain: "dataset and source-organ protein abundance measurement"
    caveat: "Abundance is reported in ppm; source organ terms are not asserted equivalent to HPA tissues."
  gtex_qtl:
    display_name: "GTEx official significant pairs"
    layer: "qtl"
    source_release: "v11"
    record_grain: "official significant pair"
    caveat: "Variant identifiers and loci use GRCh38; GTEx significant-pair semantics are retained."
  eqtlgen_qtl:
    display_name: "eQTLGen cis-eQTL"
    layer: "qtl"
    source_release: "2019-12-11"
    record_grain: "official FDR below 0.05 cis-eQTL association"
    caveat: "This is a blood meta-analysis on GRCh37 and is not directly merged with GRCh38 variant keys."
  qtlbase_qtl:
    display_name: "QTLbase associations"
    layer: "qtl"
    source_release: "v2"
    record_grain: "association record"
    caveat: "Associations are not a uniform significant set; GRCh38 chromosome-position loci lack REF, ALT, and rsID."
  biogrid_interaction:
    display_name: "BioGRID project interaction evidence"
    layer: "interaction"
    source_release: "not_recorded"
    record_grain: "evidence membership by project context"
    caveat: "Physical and genetic evidence remain separate; project context is curation scope, not interaction activity."
  intact_interaction:
    display_name: "IntAct context interaction evidence"
    layer: "interaction"
    source_release: "not_recorded"
    record_grain: "evidence membership by curation context"
    caveat: "Negative evidence and expansion context remain explicit; context does not prove tissue- or disease-specific activity."
  intact_mutation_effect:
    display_name: "IntAct mutation effects"
    layer: "interaction"
    source_release: "not_recorded"
    record_grain: "mutation feature row"
    caveat: "Mutation effects are an independent sub-resource and are excluded from general interaction counts."
  clingen_gene_disease_validity:
    display_name: "ClinGen gene-disease validity"
    layer: "disease"
    source_release: "not_recorded"
    record_grain: "expert-panel gene-disease assertion"
    caveat: "Disputed and Refuted are conflict states, not weak positive evidence; quarantine records are excluded."
  clingen_dosage:
    display_name: "ClinGen dosage sensitivity"
    layer: "disease"
    source_release: "not_recorded"
    record_grain: "gene dosage curation"
    caveat: "Haploinsufficiency and triplosensitivity remain independent; quarantine records are excluded."
  gencc_assertion:
    display_name: "GenCC gene-disease assertions"
    layer: "disease"
    source_release: "not_recorded"
    record_grain: "submitter-specific assertion"
    caveat: "Each submitter assertion remains independent and is not voted across sources."
  omim_gene_disease:
    display_name: "OMIM gene-disease relationships"
    layer: "disease"
    source_release: "not_recorded"
    record_grain: "gene record phenotype relationship"
    caveat: "Inheritance, mapping key, relationship status, and cytogenetic location retain source semantics."
  hpo_disease_phenotype:
    display_name: "Human Phenotype Ontology disease annotations"
    layer: "disease"
    source_release: "not_recorded"
    record_grain: "disease-phenotype annotation evidence"
    caveat: "Observed, explicitly absent, and inheritance-aspect annotations are separate; source duplicate evidence is retained."
  mondo_navigation:
    display_name: "MONDO disease navigation"
    layer: "disease_navigation"
    source_release: "not_recorded"
    record_grain: "eligible exact disease mapping and category membership"
    caveat: "Only eligible_for_unique_merge exact xrefs or direct MONDO identifiers are used automatically; MONDO does not replace source disease labels."
